<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配音实验室 · 074</title><link rel="stylesheet" href="/assets/story_theme.css"><link rel="stylesheet" href="/assets/app_nav.css"><link rel="stylesheet" href="/assets/voice_lab.css"><script src="/assets/desktop_bridge.js"></script></head><body data-theme="dark"><aside id="app-nav" aria-label="主导航"></aside><script src="/assets/app_nav.js"></script>
<main><header><h1>配音实验室</h1><p>输入文本 → 选音色和语速 → 一键生成 mp3。试音色、补配音都在这里， 不走流水线、不写任务历史。</p></header>
<section class="card"><label for="voice-text">配音文本 <small id="text-count">· 0 / 10000 字</small></label><textarea id="voice-text" rows="5" maxlength="10000" placeholder="粘贴或输入要配音的文本，比如一段开场白、一句旁白…"></textarea>
<div class="field"><label>配音引擎 <small style="color:var(--muted);font-weight:400">· 先选引擎，再选该引擎下的音色</small></label><div class="chips" id="voice-providers"></div></div><div class="field"><label>音色</label><div class="chips" id="voice-choices"></div></div><div class="field"><label>语速</label><div class="chips" id="voice-speed"></div></div>
<div class="row"><button id="synthesize" class="primary" disabled>♫ 生成配音</button><small>使用系统设置里的 TTS 凭据，不扣积分</small></div><p id="voice-notice" role="status"></p></section>
<section><header class="row"><h2>本次生成 <small id="voice-total">· 0</small></h2><button id="open-voice-folder" title="打开 voice-lab 产物文件夹">▱ 打开文件夹</button></header><div id="voice-results"><div class="empty">还没有生成过配音，先在上面输入文本试试</div></div></section></main><script src="/assets/voice_lab.js"></script></body></html>
