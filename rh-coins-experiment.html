<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RH币生图 · 独立实验 · 074</title>
<link rel="stylesheet" href="/assets/story_theme.css"><link rel="stylesheet" href="/assets/app_nav.css"><link rel="stylesheet" href="/assets/voice_lab.css"><script src="/assets/desktop_bridge.js"></script>
<style>main{max-width:1100px}.rh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}input[type=checkbox]{width:auto}.rh-job{border:1px solid var(--border);border-radius:10px;padding:16px;margin:12px 0}.rh-job p,#rh-status{white-space:pre-wrap;overflow-wrap:anywhere}.rh-job img{display:block;max-width:100%;max-height:480px;object-fit:contain;margin:12px 0}.rh-job button{margin:8px 8px 0 0}a{color:var(--brand)}.rh-checks{display:grid;gap:10px;margin:14px 0}.rh-checks label{display:flex;gap:10px;align-items:flex-start}#rh-key{font-family:monospace}#rh-key,#rh-directory,#rh-preset{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--border);border-radius:6px;background:#101519;color:#e6edf3}.rh-grid a{display:block;margin-top:8px}#rh-directory{margin-bottom:8px}</style></head>
<body data-theme="dark"><aside id="app-nav" aria-label="主导航"></aside><script src="/assets/app_nav.js"></script>
<main><header><h1>RH币生图 · 独立实验</h1><p>默认关闭。单独测试一张 Qwen 图片，使用国内站消费级会员 Key。</p><p class="help">运行按实际时长消耗 RH 币；实际扣费以 RH 账单为准。当前待实跑验证。</p></header>
<section class="card"><h2>连接与工作流</h2><label><input id="rh-enabled" type="checkbox"> 启用 RH 币独立实验</label>
<div class="rh-grid"><div class="field"><label for="rh-key">消费级会员 Key（独立保存）</label><input id="rh-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="从国内站「消费级-会员」页面复制"><a href="https://www.runninghub.cn/enterprise-api/consumerApi" target="_blank" rel="noopener">打开会员 Key 页面 ↗</a></div>
<div class="field"><label for="rh-preset">Qwen 工作流候选</label><select id="rh-preset"></select><a id="rh-workflow-link" target="_blank" rel="noopener">查看所选工作流 ↗</a></div></div>
<div class="rh-checks"><label><input id="rh-member" type="checkbox"> 我使用的是上述国内站的消费级会员 Key</label><label><input id="rh-web" type="checkbox"> 我已在同一账户网页运行所选工作流，并正常出图</label></div>
<div class="row"><button id="rh-save" type="button">保存配置</button><button id="rh-check" type="button">核对配置，不生成</button></div>
<p id="rh-account" class="help">正在读取独立配置…</p><p id="rh-workflow" class="help"></p><p class="help">核对会读取账户和完整工作流，不提交生成。不能把平台返回的账户类型自动当作会员 Key 计费证明；首次试用后请核对账单。<a href="https://runninghub.feishu.cn/wiki/Vc77w5EaUirOY5kyTQNcrr7GnUd" target="_blank" rel="noopener">官方手册 ↗</a></p></section>
<section class="card"><h2>生成一张</h2><div class="field"><label for="rh-prompt">画面描述</label><textarea id="rh-prompt" rows="5" maxlength="8000" placeholder="描述主体、场景、风格和限制。比如：旧书房的木桌与报纸，复古摄影，人物完全背对镜头，不露脸。"></textarea></div>
<div class="field"><label for="rh-ratio">画面比例（最长边1024）</label><select id="rh-ratio"><option value="9:16">9:16 竖图</option><option value="3:4">3:4 封面</option><option value="1:1">1:1 方图</option><option value="16:9">16:9 横图</option></select></div>
<div class="row"><button id="rh-generate" type="button" class="primary" disabled>生成1张（消耗RH币）</button><button id="rh-refresh" type="button">刷新原任务记录</button></div><p id="rh-status" role="status" aria-live="polite"></p></section>
<section class="card"><h2>测试记录与图片</h2><div class="field"><label for="rh-directory">另存文件夹</label><input id="rh-directory" placeholder="完整文件夹路径"><button id="rh-choose" type="button">选择文件夹</button></div><p class="help">另存会复制已取回的本地图片，不重新生成；同名文件自动另编号。</p><div id="rh-jobs"></div></section></main>
<script src="/assets/rh_coins_experiment.js"></script></body></html>
