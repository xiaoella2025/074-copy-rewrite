<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>app074 · 任务</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📋</text></svg>">
<link rel="stylesheet" href="/assets/story_theme.css">
<style>
/* === STORY 1.24.0 真值 oklch 变量 === */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;
  --brand-hue:168;
  --bg:oklch(.165 .008 250);--panel:oklch(.195 .009 250);--panel-2:oklch(.215 .01 250);
  --text:oklch(.96 .005 250);--muted:oklch(.72 .008 250);--text-faint:oklch(.42 .01 250);
  --ok:oklch(.74 .17 145);--warn:oklch(.8 .15 82);--err:oklch(.68 .2 25);
  --accent:oklch(.72 .16 var(--brand-hue));--accent-2:oklch(.78 .17 var(--brand-hue));
  --accent-soft:oklch(.72 .16 var(--brand-hue) / .12);
  --border:oklch(.28 .01 250);--border-subtle:oklch(.23 .008 250);--border-strong:oklch(.36 .012 250);
  /* STORY 真值别名 */
  --brand:var(--accent);--brand-hover:var(--accent-2);--brand-soft:var(--accent-soft);
  --brand-fg:oklch(.15 .01 250);--text-muted:var(--muted);--text-subtle:oklch(.56 .01 250);
  --bg-elevated:var(--panel);--bg-raised:var(--panel-2);--bg-sunken:oklch(.145 .008 250);
  --bg-hover:oklch(.235 .011 250);--bg-active:oklch(.265 .012 250);
  --success:var(--ok);--info:oklch(.72 .14 240);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px -2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px -8px rgba(0,0,0,.5);
  --sidebar-bg:oklch(.15 .008 250);
}
[data-theme=light]{
  --bg:oklch(.99 .003 250);--panel:oklch(1 0 0);--panel-2:oklch(.985 .003 250);
  --text:oklch(.22 .01 250);--muted:oklch(.44 .01 250);--text-faint:oklch(.7 .008 250);
  --ok:oklch(.56 .17 145);--warn:oklch(.6 .15 65);--err:oklch(.55 .2 25);
  --accent:oklch(.56 .16 var(--brand-hue));--accent-2:oklch(.5 .17 var(--brand-hue));
  --accent-soft:oklch(.56 .16 var(--brand-hue) / .12);
  --border:oklch(.9 .005 250);--border-subtle:oklch(.94 .004 250);--border-strong:oklch(.82 .007 250);
  --brand-fg:oklch(.99 .003 250);
  --shadow-sm:0 1px 2px rgba(15,20,28,.06);
  --shadow-md:0 4px 12px -2px rgba(15,20,28,.08);
  --shadow-lg:0 12px 32px -8px rgba(15,20,28,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:70px 24px 24px 264px;min-height:100vh;}
.app-titlebar{position:fixed;z-index:20;top:0;left:0;right:0;height:36px;display:flex;align-items:center;padding:0 15px;background:var(--bg-sunken);border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--muted)}
.app-titlebar strong{color:var(--brand);margin-right:8px}
.app-sidebar{position:fixed;z-index:19;top:36px;bottom:0;left:0;width:240px;padding:16px 12px;background:var(--sidebar-bg);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:5px}
.app-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;font-weight:700}.app-logo{display:grid;place-items:center;width:34px;height:34px;background:var(--brand-soft);border-radius:10px;color:var(--brand);font-size:20px}
.app-brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}.app-sidebar a{display:block;text-decoration:none;color:var(--muted);font-size:13px;padding:10px 12px;border-radius:7px}.app-sidebar a:hover,.app-sidebar a.active{background:var(--bg-hover);color:var(--text)}.app-sidebar a.new{background:var(--brand-soft);color:var(--brand);font-weight:650;margin-bottom:14px}.app-side-label{font-size:10px;color:var(--text-faint);padding:16px 12px 4px}.app-side-bottom{margin-top:auto;border-top:1px solid var(--border-subtle);padding-top:12px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.header h1{font-size:18px;font-weight:600;}
.header .badge{background:var(--panel-2);color:var(--muted);padding:4px 10px;border-radius:6px;font-size:12px;}
.header .spacer{flex:1;}
.btn{background:var(--panel);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:all .15s;font-weight:500;}
.btn:hover{border-color:var(--brand);color:var(--brand);}
.btn.primary,.btn.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg);}
.btn.primary:hover,.btn.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);}
.btn.danger{color:var(--err);border-color:color-mix(in oklch,var(--err) 22%,transparent);}
.btn.ghost,.btn.btn-ghost{background:transparent;color:var(--text-muted);}
.layout{display:block;min-height:calc(100vh - 128px);}
.list-panel{background:var(--panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:10px;overflow-y:auto;box-shadow:var(--shadow-sm);}
.detail-panel{background:var(--panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:18px;overflow-y:auto;box-shadow:var(--shadow-sm);}
body:not(.editing) .list-panel{display:flex;flex-direction:column;gap:6px;overflow:visible}
body:not(.editing) .detail-panel{display:none}
body.editing .layout{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:18px;height:calc(100vh - 128px)}
/* === 任务列表卡片 — STORY 真值 === */
.task-card{padding:12px 38px 12px 14px;border-radius:var(--radius-md);cursor:pointer;margin-bottom:6px;border:1px solid var(--border-subtle);transition:all .15s;position:relative;background:var(--panel-2);}
.task-card .task-delete{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:1px solid var(--border);background:var(--bg-raised);color:var(--muted);border-radius:var(--radius-sm);cursor:pointer;font-size:18px;line-height:1;transition:.12s;display:grid;place-items:center;font-family:var(--font-sans);}
.task-card .task-delete:hover{background:rgba(255,107,107,.18);color:#ff7a7a;border-color:rgba(255,107,107,.5);}
.task-card:hover{background:var(--bg-hover);}
.task-card.active{background:var(--brand-soft);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);}
.task-card.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--brand);border-radius:0 3px 3px 0;}
.task-card .title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:24px;}
.task-card .meta{font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;}
.task-card .meta>span{display:inline-flex;align-items:center;gap:3px;}
.task-card .progress{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);margin-top:6px;}
.task-card .progress-bar{flex:1;height:6px;background:var(--bg-sunken);border-radius:3px;overflow:hidden;min-width:60px;}
.task-card .progress-fill{height:100%;background:var(--brand);border-radius:3px;transition:width .2s;}
.task-card .progress-label{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
/* === step-pill 改 settings-pip 4 态 === */
.step-pill{display:inline-flex;align-items:center;gap:4px;background:var(--bg-raised);color:var(--text-muted);padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:500;border:1px solid var(--border-subtle);}
.step-pill.done{background:color-mix(in oklch,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in oklch,var(--ok) 24%,transparent);}
.step-pill.meta{background:color-mix(in oklch,var(--brand) 14%,transparent);color:var(--brand);border-color:color-mix(in oklch,var(--brand) 24%,transparent);}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border-subtle);}
.detail-header h2{font-size:17px;font-weight:600;flex:1;color:var(--text);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:999px;font-size:11px;color:var(--text-muted);font-weight:500;white-space:nowrap;}
.badge strong{color:var(--text);font-weight:600;}
.section{margin-bottom:20px;}
.section h3{font-size:13.5px;color:var(--brand);margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:8px;}
/* === shot-item 改 settings-card 风格 === */
.shot-item{background:var(--bg-raised);padding:12px 14px;border-radius:var(--radius-md);margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border-subtle);}
.shot-item .idx{background:var(--brand-soft);color:var(--brand);padding:3px 9px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;flex-shrink:0;}
.shot-item .txt{font-size:13px;line-height:1.6;flex:1;color:var(--text);}
.shot-item img{max-width:140px;border-radius:var(--radius-sm);margin-left:8px;border:1px solid var(--border-subtle);}
.shot-item audio{height:32px;margin-left:8px;}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.image-grid .item{background:var(--bg-raised);padding:8px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);}
.image-grid img{width:100%;border-radius:var(--radius-sm);}
.image-grid .label{font-size:11px;color:var(--muted);margin-top:4px;}
.meta-k{color:var(--muted);font-size:11px;margin-bottom:2px;}
.meta-v{color:var(--text);font-size:13px;word-break:break-all;line-height:1.5;background:var(--bg-raised);padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);}
.json-block{background:var(--bg-sunken);padding:12px 14px;border-radius:var(--radius-md);font-family:var(--font-mono);font-size:11.5px;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-all;border:1px solid var(--border-subtle);color:var(--text-muted);}
.edit-panel{margin-top:9px;background:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px;}
.edit-panel summary{cursor:pointer;color:var(--brand);font-size:12px;margin-bottom:8px;}
.edit-panel textarea{display:block;width:100%;min-height:74px;margin:7px 0 10px;padding:9px;background:var(--bg-sunken);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font:12px/1.6 var(--font-sans);resize:vertical;}
.edit-panel .edit-caption{font-size:11px;color:var(--muted);margin-top:6px;}
.refresh-icon{animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
/* === STORY 真值：settings-section-head + settings-pip === */
.settings-section-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.settings-section-icon{width:32px;height:32px;border-radius:var(--radius-md);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:15px;flex-shrink:0;}
.settings-section-title{font-size:14.5px;font-weight:600;color:var(--text);line-height:1.3;}
.settings-section-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;}
.settings-section-head .flex-1{flex:1;min-width:0;}
.settings-pip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--bg-raised);color:var(--muted);border:1px solid var(--border-subtle);white-space:nowrap;flex-shrink:0;}
.settings-pip-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.65;flex-shrink:0;}
.settings-pip.ok{background:color-mix(in oklch,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in oklch,var(--ok) 24%,transparent);}
.settings-pip.ok .settings-pip-dot{background:var(--ok);opacity:1;box-shadow:0 0 0 2px color-mix(in oklch,var(--ok) 18%,transparent);}
.settings-pip.warn{background:color-mix(in oklch,var(--warn) 14%,transparent);color:var(--warn);border-color:color-mix(in oklch,var(--warn) 24%,transparent);}
.settings-pip.bad{background:color-mix(in oklch,var(--err) 14%,transparent);color:var(--err);border-color:color-mix(in oklch,var(--err) 24%,transparent);}
@media(max-width:900px){body{padding-left:20px;padding-top:58px}.app-sidebar{display:none}.layout{grid-template-columns:280px minmax(0,1fr)}}
@media(max-width:640px){body{padding:56px 10px 10px}body.editing .layout{display:block;height:auto}body.editing .list-panel{max-height:210px;margin-bottom:10px}body.editing .detail-panel{min-height:50vh}.settings-section-head{flex-wrap:wrap}}
</style>

</head>
<body data-theme="dark">

<aside id="app-nav" aria-label="主导航"></aside><script src="/assets/app_nav.js"></script>
<div class="settings-section-head">
  <div class="settings-section-icon">📋</div>
  <div class="flex-1">
    <div class="settings-section-title" id="page-title">任务队列</div>
    <div class="settings-section-sub" id="page-sub">查看正在进行的任务 · 继续未完成阶段</div>
  </div>
  <span class="settings-pip" id="badge-count"><span class="settings-pip-dot"></span>0 个任务</span>
  <button class="btn" onclick="loadList()">🔄 刷新</button>
  <button class="btn btn-primary" onclick="location.href='/'">＋ 新建任务</button>
  <button class="btn btn-ghost" onclick="location.href='/settings.html'">⚙ 设置</button>
  <button class="btn btn-ghost" id="btn-toggle-theme">🌗 主题</button>
</div>

<div id="history-controls" hidden></div>
<script src="/assets/story_history.js"></script>
<div class="layout">
  <div class="list-panel" id="list-panel">
    <div class="empty-state">加载中...</div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="empty-state">← 选择左侧任务进行人工修改</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STEP_LABELS = {0:"预审",1:"改写","meta":"元信息",2:"分镜",3:"出图Prompt",4:"出图",5:"配音",6:"草稿"};
let currentTaskId = null;
const editMode = new URLSearchParams(location.search).get("edit") === "1";
const filter = new URLSearchParams(location.search).get("filter") === "done" ? "done" : "active";
document.body.classList.toggle("editing", editMode);
document.body.dataset.filter = filter;
if (filter === "done") {
  $("page-title").textContent = "历史任务";
  $("page-sub").textContent = "查看任务记录 · 分步产物 · 草稿路径";
  document.querySelector('[data-side="history"]')?.classList.add("active");
} else {
  document.querySelector('[data-side="queue"]')?.classList.add("active");
}

function isActiveTask(t) {
  const steps = Array.isArray(t.completed_steps) ? t.completed_steps : [];
  return !steps.includes(6);
}
function isDoneTask(t) {
  return (t.completed_steps || []).includes(6);
}

async function api(path, method = "GET", body = null) {
  const opt = {method, headers: {"Content-Type": "application/json"}};
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); } catch { j = {error: t}; }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function renderStepPills(steps) {
  // 图文实际执行顺序：预审 → 改写 → 元信息 → 分镜 → 配音 → 绘图提示词 → 出图 → 草稿
  const order = [0, 1, "meta", 2, 5, 3, 4, 6];
  return order.map(k => {
    const done = steps.includes(k);
    const cls = done ? (k === "meta" ? "meta" : "done") : "";
    return `<span class="step-pill ${cls}">${STEP_LABELS[k] || k}</span>`;
  }).join("");
}

async function loadList() {
  $("list-panel").innerHTML = '<div class="empty-state"><span class="refresh-icon">⏳</span> 加载中...</div>';
  try {
    const r = await api("/api/tasks");
    const all = r.tasks || [];
    const tasks = filter === "done" ? all : all.filter(isActiveTask);
    if(filter === "done" && !editMode){StoryHistory.render(all,{select:selectTask,api});return;}
    $("badge-count").innerHTML = `<span class="settings-pip-dot"></span>${tasks.length} 个${filter === "done" ? "已完成" : "进行中"}`;
    $("badge-count").className = "settings-pip ok";
    if (tasks.length === 0) {
      $("list-panel").innerHTML = '<div class="empty-state">暂无任务<br><br><a href="index.html" style="color:var(--accent)">→ 去创建一个</a></div>';
      return;
    }
    $("list-panel").innerHTML = tasks.map(t => {
      const title = t.title || (t.task_id && t.task_id.length > 16 ? t.task_id.slice(0, 12) + '…' : t.task_id);
      const done = (t.completed_steps || []).filter(k => k !== 'meta').length;
      const total = 7;
      const pct = Math.min(100, Math.round(done / total * 100));
      return `
      <div class="task-card ${t.task_id === currentTaskId ? 'active' : ''}" data-id="${escapeHtml(t.task_id)}">
        <button type="button" class="task-delete" data-action="delete" title="删除任务" aria-label="删除任务">×</button>
        <div class="title">${escapeHtml(title)}</div>
        <div class="meta">
          <span>🕒 ${escapeHtml((t.created_at || '').slice(5, 16))}</span>
          <span>🎬 ${t.shot_count || 0} 镜</span>
          <span>🖼 ${t.image_count || 0} 图</span>
          <span>🎤 ${t.audio_count || 0} 音${t.total_duration_sec ? ' · ' + t.total_duration_sec + 's' : ''}</span>
        </div>
        <div class="progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${done}/${total} 步</div>
        </div>
      </div>
    `;}).join("");
    $("list-panel").querySelectorAll(".task-card").forEach(card => {
      card.onclick = (e) => {
        if (e.target.closest('[data-action="delete"]')) return;
        selectTask(card.dataset.id);
      };
      const delBtn = card.querySelector('[data-action="delete"]');
      if (delBtn) delBtn.onclick = async (e) => {
        e.stopPropagation();
        const tid = card.dataset.id;
        if (!confirm(`确认删除任务 ${tid}？\n将删除该任务的全部产物文件，此操作不可撤销。`)) return;
        try {
          await api(`/api/task/${encodeURIComponent(tid)}`, "DELETE");
          card.remove();
        } catch (err) {
          alert("删除失败：" + err.message);
        }
      };
    });
    const requested = new URLSearchParams(location.search).get("task");
    if (requested && !editMode && tasks.some(t => t.task_id === requested)) {
      location.replace("/result.html?task=" + encodeURIComponent(requested));
      return;
    }
    if (editMode && !currentTaskId) selectTask(requested && tasks.some(t => t.task_id === requested) ? requested : tasks[0].task_id);
  } catch (e) {
    $("list-panel").innerHTML = `<div class="empty-state" style="color:var(--err)">❌ ${escapeHtml(e.message)}</div>`;
  }
}

async function selectTask(taskId) {
  if (!editMode) {
    location.href = "/result.html?task=" + encodeURIComponent(taskId);
    return;
  }
  currentTaskId = taskId;
  // 高亮
  document.querySelectorAll(".task-card").forEach(c => c.classList.toggle("active", c.dataset.id === taskId));
  // 加载详情
  $("detail-panel").innerHTML = '<div class="empty-state"><span class="refresh-icon">⏳</span> 加载中...</div>';
  try {
    const d = await api(`/api/task/${encodeURIComponent(taskId)}`);
    renderDetail(d);
  } catch (e) {
    $("detail-panel").innerHTML = `<div class="empty-state" style="color:var(--err)">❌ ${escapeHtml(e.message)}</div>`;
  }
}

function renderDetail(d) {
  const info = d.info;
  const steps = d.steps || {};
  const html = [];
  // Header
  html.push(`<div class="detail-header">
    <h2>${escapeHtml(info.title || info.task_id)}</h2>
    <span class="badge">${info.completed_steps.length}/8 步完成</span>
    <span class="badge">${info.created_at}</span>
    ${info.draft_dir ? `<span class="badge" title="剪映草稿路径">📁 ${escapeHtml(info.draft_dir)}</span>` : ''}
    <a class="btn" href="/result.html?task=${encodeURIComponent(info.task_id)}">查看独立结果</a>
    ${!info.completed_steps.includes(6) && info.shot_count ? `<button type="button" class="btn" data-resume-id="${escapeHtml(info.task_id)}">▶ 继续未完成阶段</button>` : ''}
  </div>`);
  // 统计
  html.push(`<div class="section">
    <h3>📊 产物统计</h3>
    <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:12px">
      <div><div class="meta-k">分镜数</div><div class="meta-v">${info.shot_count}</div></div>
      <div><div class="meta-k">出图数</div><div class="meta-v">${info.image_count}</div></div>
      <div><div class="meta-k">配音数</div><div class="meta-v">${info.audio_count}</div></div>
      <div><div class="meta-k">总时长</div><div class="meta-v">${info.total_duration_sec || 0}s</div></div>
    </div>
  </div>`);
  // 改写
  if (steps.rewrite) {
    html.push(`<div class="section">
      <h3>📝 Step 1 改写后文案（${steps.rewrite.length} 字）</h3>
      <div class="json-block">${escapeHtml(steps.rewrite)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button type="button" class="btn" data-knowledge-export="obsidian">存入 Obsidian</button>
        <button type="button" class="btn" data-knowledge-export="ima">存入 IMA</button>
      </div>
      <div id="knowledge-export-status" class="edit-caption" role="status"></div>
      <details class="edit-panel"><summary>人工修改文案</summary>
        <textarea id="edit-rewrite">${escapeHtml(steps.rewrite)}</textarea>
        <button type="button" class="btn" id="save-rewrite">保存为新版本并续跑</button>
        <div class="edit-caption">会重新生成元信息和分镜；原任务保留。</div>
      </details>
    </div>`);
  }
  // 元信息
  if (steps.meta) {
    const m = steps.meta;
    html.push(`<div class="section">
      <h3>★ 元信息</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><div class="meta-k">封面主标题</div><div class="meta-v">${escapeHtml(m.title || "")}</div></div>
        <div><div class="meta-k">短标题（≤16字）</div><div class="meta-v">${escapeHtml(m.short_title || "")}</div></div>
        <div style="grid-column:1/-1"><div class="meta-k">发布文案</div><div class="meta-v">${escapeHtml(m.summary || "")}</div></div>
        <div style="grid-column:1/-1"><div class="meta-k">话题标签</div><div class="meta-v">${(m.tags || []).map(escapeHtml).join(" ")}</div></div>
        <div style="grid-column:1/-1"><div class="meta-k">种子评论</div><div class="meta-v">${(m.comments || []).map((c, i) => `${i+1}. ${escapeHtml(c)}`).join("<br>")}</div></div>
        <div style="grid-column:1/-1"><div class="meta-k">封面构图方向</div><div class="meta-v">${(m.cover_image_prompts || []).map((c, i) => `${i+1}. ${escapeHtml(c)}`).join("<br><br>")}</div></div>
      </div>
    </div>`);
  }
  // 分镜
  if (steps.shots && steps.shots.length) {
    html.push(`<div class="section">
      <h3>🎬 Step 2 分镜（${steps.shots.length} 镜）</h3>
      ${steps.shots.map(s => `<div class="shot-item"><div class="idx">${s.idx}</div><div class="txt">${escapeHtml(s.text || "")}</div></div>`).join("")}
      <details class="edit-panel"><summary>人工修改分镜</summary>
        ${steps.shots.map((s, i) => `<div class="edit-caption">第 ${s.idx} 镜</div><textarea data-edit-shot="${i}">${escapeHtml(s.text || "")}</textarea>`).join("")}
        <button type="button" class="btn" id="save-shots">保存为新版本并续跑</button>
        <div class="edit-caption">会重新配音和出图；原任务保留。</div>
      </details>
    </div>`);
  }
  // 出图 prompt
  if (steps.prompts && steps.prompts.length) {
    html.push(`<div class="section">
      <h3>🎨 Step 3 出图 Prompt（${steps.prompts.length} 个）</h3>
      ${steps.prompts.map(p => `<div class="shot-item"><div class="idx">${p.idx}</div><div class="txt">${escapeHtml(p.desc_prompt || "")}</div></div>`).join("")}
      <details class="edit-panel"><summary>人工修改绘图提示词</summary>
        ${steps.prompts.map((p, i) => `<div class="edit-caption">第 ${p.idx} 镜</div><textarea data-edit-prompt="${i}">${escapeHtml(p.desc_prompt || "")}</textarea>`).join("")}
        <button type="button" class="btn" id="save-prompts">保存为新版本并续跑</button>
        <div class="edit-caption">只重画提示词变更的镜头；原任务保留。</div>
      </details>
    </div>`);
  }
  // 出图图片
  if (steps.images && steps.images.length) {
    html.push(`<div class="section">
      <h3>🖼 Step 4 出图（${steps.images.length} 张）</h3>
      <div class="image-grid">
        ${steps.images.map(img => `<div class="item"><img src="${escapeHtml(img.url)}" loading="lazy"><div class="label">${escapeHtml(img.name)} · ${(img.size/1024).toFixed(1)}KB</div>${/^\d+\.(png|jpe?g|webp)$/i.test(img.name) ? `<button type="button" class="btn" data-redraw-idx="${Number(img.name.split('.')[0])}" style="margin-top:6px">重画本镜</button>` : ''}</div>`).join("")}
      </div>
    </div>`);
  }
  // 配音
  if (steps.audios && steps.audios.length) {
    html.push(`<div class="section">
      <h3>🎤 Step 5 配音（${steps.audios.length} 段）</h3>
      ${steps.audios.map((a, i) => {
        const seg = (steps.segments || [])[i] || {};
        return `<div class="shot-item">
          <div class="idx">${a.name.replace("seg_", "").replace(".mp3", "")}</div>
          <audio controls src="${escapeHtml(a.url)}"></audio>
          <div class="txt" style="flex:0 0 auto">${(seg.duration || 0).toFixed(1)}s · ${(a.size/1024).toFixed(1)}KB</div>
        </div>`;
      }).join("")}
    </div>`);
  }
  // 草稿
  if (steps.draft) {
    const dr = steps.draft;
    html.push(`<div class="section">
      <h3>📦 Step 6 剪映草稿</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><div class="meta-k">标题</div><div class="meta-v">${escapeHtml(dr.title || "")}</div></div>
        <div><div class="meta-k">分镜数</div><div class="meta-v">${dr.shot_count}</div></div>
        <div><div class="meta-k">出图数</div><div class="meta-v">${dr.image_count}</div></div>
        <div><div class="meta-k">配音数</div><div class="meta-v">${dr.segment_count}</div></div>
        <div><div class="meta-k">总时长</div><div class="meta-v">${dr.total_duration_sec}s</div></div>
        <div style="grid-column:1/-1"><div class="meta-k">草稿目录</div><div class="meta-v">${escapeHtml(dr.draft_dir || "")}</div></div>
      </div>
    </div>`);
  }
  $("detail-panel").innerHTML = html.join("");
  const resumeButton = $("detail-panel").querySelector("[data-resume-id]");
  if (resumeButton) resumeButton.onclick = () => {
    location.href = "/index.html?resume=" + encodeURIComponent(info.task_id);
  };
  const fork = async (field, value) => {
    try {
      const r = await api("/api/task/fork", "POST", {task_id: info.task_id, field, value});
      location.href = "/index.html?resume=" + encodeURIComponent(r.task_id);
    } catch (e) { alert("保存新版本失败：" + e.message); }
  };
  $("save-rewrite")?.addEventListener("click", () => fork("rewrite", $("edit-rewrite").value));
  $("save-shots")?.addEventListener("click", () => fork("shots", steps.shots.map((shot, i) => ({
    ...shot, text: document.querySelector(`[data-edit-shot="${i}"]`).value.trim(),
  }))));
  $("save-prompts")?.addEventListener("click", () => fork("prompts", steps.prompts.map((prompt, i) => ({
    ...prompt, desc_prompt: document.querySelector(`[data-edit-prompt="${i}"]`).value.trim(),
  }))));
  $("detail-panel").querySelectorAll("[data-redraw-idx]").forEach(button => {
    button.onclick = () => fork("redraw", Number(button.dataset.redrawIdx));
  });
  $("detail-panel").querySelectorAll("[data-knowledge-export]").forEach(button => {
    button.onclick = async () => {
      const status = $("knowledge-export-status");
      button.disabled = true;
      status.textContent = "保存中…";
      try {
        const result = await api("/api/knowledge/export", "POST", {
          task_id: info.task_id, provider: button.dataset.knowledgeExport,
        });
        status.textContent = result.status === "already_saved" ? "此版本已存入 IMA，未重复创建。"
          : button.dataset.knowledgeExport === "obsidian" ? "已存入 Obsidian：" + result.path : "已存入 IMA。";
      } catch (error) { status.textContent = "保存失败：" + error.message; }
      finally { button.disabled = false; }
    };
  });
}

// 主题切换（与 settings.html 同步）
function toggleTheme() {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("app074-theme-v2", b.dataset.theme); } catch {}
}
try {
  const t = localStorage.getItem("app074-theme-v2");
  if (t) document.body.dataset.theme = t;
} catch {}
$("btn-toggle-theme").onclick = toggleTheme;

// 初始化
loadList();
// 自动刷新：每 5 秒
</script>
</body>
</html>
